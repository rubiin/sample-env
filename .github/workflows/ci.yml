name: CI
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.4.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: "pnpm"

      - run: pnpm install
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
